name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23', '1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -cover -count=1 ./...
      - name: Every operation in spec/openapi.json has an SDK method
        run: go test -run 'TestSpecCoverage' -count=1 -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags conformance ./...
      - run: go mod tidy && git diff --exit-code go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./... && staticcheck -tags conformance ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          cd examples && govulncheck ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .openapi
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance suite (starts the spec repo's mock server on a free port)
        run: go test -tags conformance -race -count=1 -v ./...
        env:
          STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.openapi
          CONFORMANCE_REQUIRED: '1'
      - name: Run every example against the mock server
        run: ./scripts/run-examples.sh
        env:
          STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.openapi

  examples:
    name: examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cd examples && go vet ./... && go build ./... && go test ./...
      - name: README snippets compile
        run: python3 scripts/check_readme.py

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint
